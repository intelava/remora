[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remora"
version = "0.1.0"
description = "High-performance VLM inference engine with Triton kernels"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4,<2.7",
    "torchvision>=0.19,<0.22",
    "triton>=2.1",
    "numpy>=1.24",
    "transformers>=4.40",
    "accelerate>=0.26",
    "gymnasium[atari]>=0.29",
    "ale-py>=0.8",
    "opencv-python-headless>=4.8",
    "timm>=0.9",
    "einops>=0.7",
    "sentencepiece>=0.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/remora"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pin to cu124 wheels so uv never accidentally pulls a CUDA 12.6+ build.
# Compatible with any driver that supports CUDA >= 12.4 (driver >= 550.xx).
[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu124"]
